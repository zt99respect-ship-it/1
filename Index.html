<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم الشاملة - بث 24/7</title>
    <style>
        body { background-color: #0d1117; color: #c9d1d9; font-family: Tahoma, sans-serif; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .container { background-color: #161b22; border: 1px solid #30363d; border-radius: 12px; padding: 25px; width: 100%; max-width: 450px; box-shadow: 0 8px 24px rgba(0,0,0,0.5); }
        h2 { text-align: center; color: #58a6ff; margin-bottom: 20px; font-size: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 6px; font-size: 13px; color: #8b949e; }
        input, select { width: 100%; padding: 10px; background-color: #0d1117; border: 1px solid #30363d; border-radius: 6px; color: #fff; font-size: 14px; box-sizing: border-box; }
        input:focus, select:focus { border-color: #58a6ff; outline: none; }
        .status-box { display: flex; align-items: center; justify-content: space-between; background: #21262d; padding: 10px 15px; border-radius: 6px; margin-bottom: 20px; font-size: 14px; }
        .indicator { width: 12px; height: 12px; border-radius: 50%; background: #f85149; display: inline-block; }
        .indicator.active { background: #2ea043; box-shadow: 0 0 8px #2ea043; }
        .btn-group { display: flex; gap: 10px; }
        button { flex: 1; padding: 12px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 14px; transition: 0.2s; }
        .btn-start { background-color: #2ea043; color: white; }
        .btn-start:hover { background-color: #2c974b; }
        .btn-stop { background-color: #f85149; color: white; }
        .btn-stop:hover { background-color: #da3633; }
        .msg { text-align: center; margin-top: 15px; font-size: 13px; color: #8b949e; }
    </style>
</head>
<body>

<div class="container">
    <h2>🚀 لوحة تحكم البث المباشر</h2>
    
    <div class="status-box">
        <span>حالة السيرفر:</span>
        <div><span id="statusDot" class="indicator"></span> <span id="statusText">متوقف</span></div>
    </div>

    <div class="form-group">
        <label>معرف توكن GitHub (Personal Access Token):</label>
        <input type="password" id="githubToken" value="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">
    </div>

    <div class="form-group">
        <label>اسم صاحب المستودع / اسم المستودع (Repo):</label>
        <input type="text" id="repoInfo" value="zt99respect/ship-it">
    </div>

    <div class="form-group">
        <label>اسم قناة Kick المستهدفة:</label>
        <input type="text" id="kickChannel" value="klash">
    </div>

    <div class="form-group">
        <label>مفتاح بث يوتيوب (YouTube Stream Key):</label>
        <input type="password" id="youtubeKey" value="p0ky-h9m9-cywd-wy8v-2yra">
    </div>

    <div class="form-group">
        <label>مفتاح ريستريم (Restream Key):</label>
        <input type="password" id="restreamKey" value="re_12215822_event12d2d60d5f814c68b3c0f0137cacab10">
    </div>

    <div class="form-group">
        <label>مسار البث (المنصات المستهدفة):</label>
        <select id="destSelect">
            <option value="both">يوتيوب + ريستريم (التوزيع الكامل)</option>
            <option value="youtube">يوتيوب فقط</option>
            <option value="restream">ريستريم فقط</option>
        </select>
    </div>

    <div class="form-group">
        <label>جودة سحب البث من Kick:</label>
        <select id="qualitySelect">
            <option value="best">أعلى جودة ممكنة (Best)</option>
            <option value="720p60">720p60</option>
            <option value="480p">480p</option>
        </select>
    </div>

    <div class="btn-group">
        <button class="btn-start" onclick="startBroadcast()">تشغيل البث</button>
        <button class="btn-stop" onclick="stopBroadcast()">إيقاف فوري</button>
    </div>

    <div class="msg" id="msgStatus">الإعدادات جاهزة، اضغط تشغيل مباشرة</div>
</div>

<script>
    async function startBroadcast() {
        const token = document.getElementById('githubToken').value;
        const repo = document.getElementById('repoInfo').value;
        const kick = document.getElementById('kickChannel').value;
        const yt = document.getElementById('youtubeKey').value;
        const restream = document.getElementById('restreamKey').value;
        const dest = document.getElementById('destSelect').value;
        const quality = document.getElementById('qualitySelect').value;
        const msg = document.getElementById('msgStatus');

        msg.innerText = "جاري إرسال أمر التشغيل...";

        try {
            const response = await fetch(`https://api.github.com/repos/${repo}/actions/workflows/main.yml/dispatches`, {
                method: 'POST',
                headers: {
                    'Authorization': `token ${token}`,
                    'Accept': 'application/vnd.github.v3+json',
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    ref: 'main',
                    inputs: {
                        kick_channel: kick,
                        youtube_key: yt,
                        restream_key: restream,
                        destination: dest,
                        quality: quality
                    }
                })
            });

            if(response.ok) {
                msg.innerText = "✅ تم استلام أمر التفعيل! سيبدأ البث خلال ثوانٍ.";
                document.getElementById('statusDot').classList.add('active');
                document.getElementById('statusText').innerText = "يعمل الآن";
            } else {
                msg.innerText = "❌ فشل الإرسال، تحقق من التوكن أو اسم المستودع.";
            }
        } catch(err) {
            msg.innerText = "❌ حدث خطأ في الاتصال.";
        }
    }

    function stopBroadcast() {
        document.getElementById('statusDot').classList.remove('active');
        document.getElementById('statusText').innerText = "متوقف";
        document.getElementById('msgStatus').innerText = "⚠️ تم إيقاف الواجهة محلياً.";
    }
</script>

</body>
</html>

name: 24/7 Master Broadcast

on:
  workflow_dispatch:
    inputs:
      destination:
        description: 'Target Platform (both, youtube, restream)'
        required: false
        default: 'both'
      quality:
        description: 'Stream Quality'
        required: false
        default: 'best'

permissions:
  actions: write
  contents: read

jobs:
  broadcaster:
    runs-on: ubuntu-latest

    steps:
      - name: جلب ملفات المستودع
        uses: actions/checkout@v3

      - name: تثبيت FFmpeg و Streamlink
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          pip3 install streamlink

      - name: تشغيل سكربت البث الشامل
        env:
          STREAM_DEST: ${{ github.event.inputs.destination || 'both' }}
          STREAM_QUALITY: ${{ github.event.inputs.quality || 'best' }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x stream.sh
          ./stream.sh
